name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Besitzer in Kleinschreibung (GHCR verlangt das)
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Image-Tags bestimmen
        id: tags
        run: |
          echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend-Image bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/memeparty-server:${{ steps.tags.outputs.sha }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/memeparty-server:${{ steps.tags.outputs.version }}

      - name: Web-Image bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/memeparty-web:${{ steps.tags.outputs.sha }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/memeparty-web:${{ steps.tags.outputs.version }}

      - name: Zusammenfassung
        run: |
          {
            echo "### Images"
            echo "- \`${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/memeparty-server:${{ steps.tags.outputs.version }}\`"
            echo "- \`${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/memeparty-web:${{ steps.tags.outputs.version }}\`"
            echo ""
            echo "Auf dem Server: \`IMAGE_TAG=${{ steps.tags.outputs.version }} ./deploy/deploy.sh\`"
          } >> "$GITHUB_STEP_SUMMARY"
