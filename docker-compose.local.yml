name: memeparty-local
services:
  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:${LOCAL_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3001
      BIND_HOST: 0.0.0.0
      PUBLIC_ORIGIN: http://localhost:${LOCAL_PORT:-8080}
      TRUST_PROXY: "false"
      DATABASE_URL: postgresql://memeparty:${LOCAL_DB_PASSWORD:?Start with Start-MemeParty.cmd or start-local.sh}@postgres:5432/memeparty
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /app/data/uploads
      ADMIN_EMAILS: ${LOCAL_ADMIN_EMAIL:-admin@memeparty.local}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 30
    restart: unless-stopped
    volumes:
      - local_uploads:/app/data/uploads
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: memeparty
      POSTGRES_USER: memeparty
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Start with Start-MemeParty.cmd or start-local.sh}
    volumes:
      - local_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memeparty -d memeparty"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - local_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
volumes:
  local_postgres:
  local_redis:
  local_uploads:
